name: Mapa de calor y redes

on:
  schedule:
    # Cada hora en días hábiles; el script sólo actualiza las bolsas abiertas (y la hora siguiente a su cierre).
    - cron: '50 * * * 1-5'
    # Fines de semana sólo se refresca el feed de redes y medios.
    - cron: '20 */3 * * 0,6'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/heatmaps.py
      - scripts/feeds.py
      - .github/workflows/heatmaps.yml

permissions:
  contents: write

concurrency:
  group: heatmaps
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet yfinance feedparser
      - run: python scripts/feeds.py
        continue-on-error: true
      - run: python scripts/heatmaps.py
        continue-on-error: true
        env:
          FORZAR: ${{ github.event_name != 'schedule' && '1' || '0' }}
      - name: Commit
        run: |
          for f in data/heatmaps.json data/redes.json; do if [ -f "$f" ]; then python -c "import json,sys; json.load(open(sys.argv[1]))" "$f"; fi; done
          git config user.name "Mr. Supply Chain bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/heatmaps.json data/redes.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Mapa de calor y redes $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 10; done
          exit 1

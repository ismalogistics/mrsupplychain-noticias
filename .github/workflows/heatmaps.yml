name: Heatmap de acciones

on:
  schedule:
    # Cada hora en días hábiles; el script sólo actualiza las bolsas abiertas (y la hora siguiente a su cierre).
    - cron: '50 * * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/heatmaps.py
      - .github/workflows/heatmaps.yml

permissions:
  contents: write

concurrency:
  group: heatmaps
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet yfinance
      - run: python scripts/heatmaps.py
        env:
          FORZAR: ${{ github.event_name != 'schedule' && '1' || '0' }}
      - name: Commit
        run: |
          [ -f data/heatmaps.json ] || exit 0
          python -c "import json; json.load(open('data/heatmaps.json'))"
          git config user.name "Mr. Supply Chain bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/heatmaps.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Heatmap de acciones $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 10; done
          exit 1

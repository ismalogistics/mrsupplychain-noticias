name: Páginas para buscadores y redes

on:
  push:
    branches: [main]
    paths:
      - data/index.json
      - data/latest.json
      - data/briefs/**
      - scripts/build_pages.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow
      - run: sudo apt-get install -y -qq fonts-dejavu-core >/dev/null || true
      - run: python scripts/build_pages.py
      - name: Commit
        run: |
          git config user.name "Mr. Supply Chain bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add b og archivo.html rss.xml sitemap.xml
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Páginas estáticas, RSS y sitemap $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 10; done
          exit 1

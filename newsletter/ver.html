<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Cadena de Noticias SCM</title>
<style>html,body{margin:0;height:100%;background:#0b1f47}body{display:flex;align-items:center;justify-content:center}img{height:100vh;max-width:100vw;object-fit:contain}</style></head>
<body><img id="i" alt="Cadena de Noticias SCM"><script>var f=(location.hash||'#cadena-01.png').slice(1).replace(/[^a-z0-9.\-]/gi,'');document.getElementById('i').src=f;if(window.opener&&/[?&]send=1/.test(location.search)){fetch(f).then(function(r){return r.blob()}).then(function(b){window.opener.postMessage({mscFile:f,blob:b},'https://www.linkedin.com');setTimeout(function(){window.close()},1500)});}</script></body></html>
